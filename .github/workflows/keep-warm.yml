name: Keep Warm Ping

on:
  schedule:
    # Run every 5 minutes to prevent Vercel Python serverless containers from sleeping
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          URL="${{ secrets.VERCEL_APP_URL || 'https://clubsync.vercel.app' }}/api/health"
          echo "Pinging $URL to keep serverless container warm..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
          echo "Response status code: $HTTP_STATUS"
